name: 3D Contribution Graph

on:
  # roda no push tambem, pra o SVG existir antes do README apontar pra ele.
  # commits feitos com o GITHUB_TOKEN padrao nao re-disparam workflows,
  # entao o passo de commit abaixo nao entra em loop.
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit graph
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --quiet --cached || git commit -m "Updated 3D contribution graph"
          git push
